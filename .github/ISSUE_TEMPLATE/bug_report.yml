name: Bug report
description: Report a reproducible launcher, build, or guarded-run failure.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload a raw bugreport, private run directory, firmware image,
        ADB key, device serial, boot ID, or live kernel address.

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - check
        - build
        - KASLR preflight
        - reclaim gate
        - exploit route
        - root verification
        - report redaction
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and observed behavior without private identifiers.
    validations:
      required: true

  - type: textarea
    id: redacted
    attributes:
      label: Redacted report
      description: Paste JSON produced by ./ghostlock report after reviewing it.
      render: json

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and removed private identifiers and raw diagnostics.
          required: true
        - label: I rebooted before any retry after a failed or uncertain exploit attempt.
          required: true
