name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests-macos:
    name: macOS host tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify host-only tests and privacy audit
        run: |
          python3 scripts/release_audit.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          python3 -m unittest discover -s runner -p 'test_*.py' -v
          make -C source test

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure pinned Android NDK
        run: |
          ndk_clang="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          if [[ ! -x "$ndk_clang" ]]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          fi
          test -x "$ndk_clang"

      - name: Verify tests, privacy audit, and reproducible build
        run: |
          chmod +x ghostlock scripts/verify-release.sh
          ./scripts/verify-release.sh
